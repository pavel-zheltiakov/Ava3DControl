<!DOCTYPE html>
<html lang="en">

<head>
    <title>Ava3DControl demo</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./app.css" />
</head>

<body style="margin: 0; overflow: hidden">
<!--
  The splash is ours rather than the Avalonia template's, for two reasons.

  It has a progress bar. This application is about twenty-four megabytes of relinked runtime before it can
  draw anything, which on a slow connection is a long time to look at a logo and wonder whether the page is
  broken. main.js counts the bytes as they arrive and drives the bar; the denominator is written at publish
  time by tools/build-demo.sh, because the only honest way to show a fraction is to know the total.

  And it has a failure state. A WebAssembly runtime that aborts leaves a blank canvas and a console message
  nobody will look at; a visitor deserves a sentence saying so, and somewhere else to go.

  The class name is the one Avalonia looks for — it adds splash-close when the application takes over.
-->
<div id="out">
    <div class="avalonia-splash">
        <div class="boot">
            <p class="boot-brand">Ava3D<span>Control</span></p>
            <p class="boot-line" id="boot-line">Starting…</p>
            <div class="boot-track"><div class="boot-bar" id="boot-bar"></div></div>
            <p class="boot-hint" id="boot-hint">
                The renderer is compiled to WebAssembly, so it has to arrive before it can draw anything.
                Your browser keeps it after the first visit.
            </p>
        </div>
    </div>
</div>
<!--
  The file:// case is answered here rather than in main.js, and it has to be.

  A module script is fetched with CORS, and a page opened from disk has the origin `null`, so the browser
  refuses to load main.js at all — "Access to script … from origin 'null' has been blocked by CORS policy",
  before a line of it runs. main.js knows about file:// and says so, and none of that can execute. What the
  visitor sees is the splash sitting on "Starting…" for ever, which reads as a hang rather than an answer.

  This is a classic inline script, which is the one kind that does run from disk.
-->
<script>
    if (location.protocol === 'file:') {
        document.querySelector('.boot').classList.add('failed');
        document.getElementById('boot-line').textContent = 'This page has to be served over http.';
        document.getElementById('boot-hint').innerHTML =
            'A page opened from disk may not fetch anything — not the twenty-odd megabytes of runtime this ' +
            'demo is compiled to, not even its own loader. Serve the folder instead: <code>python3 -m ' +
            'http.server</code> in <code>site/</code>, then open <code>http://localhost:8000/demo.html</code>. ' +
            '<a href="https://pavel-zheltiakov.github.io/Ava3DControl/demo.html">Or run the hosted one.</a>';
    }
</script>
<script type='module' src="./main.js"></script>
</body>

</html>
